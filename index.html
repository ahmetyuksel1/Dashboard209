<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard 209</title>
    <link rel="icon" type="image/x-icon" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "lucide-react": "https://esm.sh/lucide-react@0.263.1"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script async src="https://s.fx-w.io/widgets/exchange-rates/latest.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>

<body class="bg-black text-white overflow-hidden">

    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import ReactDOM from 'react-dom/client';
        import {
            X, Info, Plus, Trash2, Edit2, Calendar,
            CheckCircle2, Circle, Clock, Flame, Settings,
            LogOut, User, Lock, ChevronLeft, ChevronRight,
            Sun, Moon, Cloud, Copy, GripVertical
        } from 'lucide-react';

        // --- CONSTANTS ---
        const THEMES = {
            cyberpunk: {
                name: "Cyberpunk",
                bg: "bg-slate-900",
                panel: "bg-slate-800/80",
                accent: "text-purple-400",
                button: "bg-purple-600 hover:bg-purple-700",
                border: "border-purple-500/30"
            },
            matrix: {
                name: "Matrix",
                bg: "bg-black",
                panel: "bg-green-900/20",
                accent: "text-green-400",
                button: "bg-green-700 hover:bg-green-600",
                border: "border-green-500/50"
            },
            oled: {
                name: "True Black",
                bg: "bg-black",
                panel: "bg-neutral-900",
                accent: "text-white",
                button: "bg-neutral-700 hover:bg-neutral-600",
                border: "border-neutral-800"
            }
        };

        const SHORTCUT_TYPES = [
            "birth-date", "email-address", "home-address", "id-number",
            "name", "phone-number", "secondary-address", "student-number",
            "surname", "text"
        ];

        // --- MAIN APPLICATION (UPDATED WITH SESSION MANAGEMENT) ---
        function App() {
            const [user, setUser] = useState(null);
            const [usersDb, setUsersDb] = useState({});

            const [authMode, setAuthMode] = useState('login');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState('');

            const [activeTab, setActiveTab] = useState(0);
            const [theme, setTheme] = useState('cyberpunk');
            const [showSettings, setShowSettings] = useState(false);

            useEffect(() => {
                const storedUsers = localStorage.getItem('app_users_db');
                if (storedUsers) {
                    const parsedUsersDb = JSON.parse(storedUsers);
                    setUsersDb(parsedUsersDb);

                    // NEW ADDITION: Check for active user in the browser
                    const activeEmail = localStorage.getItem('app_current_user');
                    if (activeEmail && parsedUsersDb[activeEmail]) {
                        // If there is an active user, start the session by calling loginUser
                        loginUser(parsedUsersDb[activeEmail], true); // isInitialLoad: true
                    }
                }
            }, []);

            const handleRegister = (e) => {
                e.preventDefault();
                setAuthError('');

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) return setAuthError('Invalid email format.');

                if (password.length < 6) return setAuthError('Password too short (Test for min 6).');
                if (usersDb[email]) return setAuthError('This email is already registered.');

                const newUser = {
                    email,
                    password,
                    data: {
                        shortcuts: [],
                        websites: [],
                        reminders: [],
                        theme: 'cyberpunk'
                    }
                };

                const updatedDb = { ...usersDb, [email]: newUser };
                setUsersDb(updatedDb);
                localStorage.setItem('app_users_db', JSON.stringify(updatedDb));
                loginUser(newUser);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const foundUser = usersDb[email];
                if (foundUser && foundUser.password === password) {
                    loginUser(foundUser);
                } else {
                    setAuthError('Invalid email or password.');
                }
            };

            const loginUser = (userData, isInitialLoad = false) => {
                let loadedTheme = userData.data.theme || 'cyberpunk';

                // Fixed previous theme loading error and added a safeguard against 'clean' theme
                if (loadedTheme === 'clean') {
                    loadedTheme = 'cyberpunk';
                }

                setUser(userData);
                setTheme(loadedTheme);
                setAuthError('');

                // NEW ADDITION: Save session ID
                localStorage.setItem('app_current_user', userData.email);
            };

            const handleLogout = () => {
                saveUserData();
                setUser(null);
                setEmail('');
                setPassword('');
                // NEW ADDITION: Delete active session
                localStorage.removeItem('app_current_user');
            };

            const saveUserData = (overrideData = null) => {
                if (!user) return;
                const dataToSave = overrideData || user.data;
                const updatedUser = { ...user, data: dataToSave };
                const updatedDb = { ...usersDb, [user.email]: updatedUser };
                setUsersDb(updatedDb);
                localStorage.setItem('app_users_db', JSON.stringify(updatedDb));
                setUser(updatedUser);
            };

            const updateUserData = (section, newData) => {
                const currentData = { ...user.data };
                currentData[section] = newData;
                saveUserData(currentData);
            };

            const changeTheme = (newTheme) => {
                setTheme(newTheme);
                const currentData = { ...user.data, theme: newTheme };
                saveUserData(currentData);
            };

            const currentTheme = THEMES[theme];

            return (
                <div className={`min-h-screen w-full transition-colors duration-500 ${currentTheme.bg} text-slate-200 font-sans flex items-center justify-center p-4`}>
                    <div className={`relative w-full max-w-6xl aspect-video ${currentTheme.panel} backdrop-blur-xl rounded-2xl shadow-2xl border ${currentTheme.border} overflow-hidden flex flex-col`}>

                        {/* Header */}
                        <header className={`h-16 flex items-center justify-between px-6 border-b ${currentTheme.border}`}>
                            <div className="flex gap-2">
                                {/* Window control buttons (functional only for look) */}
                                <div className="w-3 h-3 rounded-full bg-red-500 hover:bg-red-400 cursor-pointer" onClick={() => setUser(null)} />
                                <div className="w-3 h-3 rounded-full bg-yellow-500 hover:bg-yellow-400 cursor-pointer" />
                                <div className="w-3 h-3 rounded-full bg-green-500 hover:bg-green-400 cursor-pointer" />
                            </div>

                            {user && (
                                <nav className="flex-1 flex justify-center gap-1 mx-4">
                                    {["Info & Shortcuts", "Website Shortcuts", "Reminders", "Counter & Clock"].map((tab, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => setActiveTab(idx)}
                                            className={`px-6 py-2 rounded-lg text-sm font-medium transition-all duration-300 ${activeTab === idx
                                                ? `${currentTheme.button} text-white shadow-lg scale-105`
                                                : "hover:bg-white/5 text-slate-400"
                                                }`}
                                        >
                                            {tab}
                                        </button>
                                    ))}
                                </nav>
                            )}

                            <div className="flex items-center gap-3">
                                {user && (
                                    <button onClick={() => setShowSettings(!showSettings)} className="p-2 rounded-full hover:bg-white/10 transition-colors">
                                        <Settings size={20} className={currentTheme.accent} />
                                    </button>
                                )}
                                <button className="p-2 rounded-full hover:bg-red-500/20 text-red-400 transition-colors" title="Close" onClick={() => window.location.reload()}>
                                    <X size={20} />
                                </button>
                            </div>
                        </header>

                        {/* Main Content */}
                        <main className="flex-1 relative overflow-hidden p-6">
                            {showSettings && (
                                <div className="absolute top-4 right-4 z-50 p-4 rounded-xl bg-slate-900 border border-slate-700 shadow-xl w-64 animate-in fade-in slide-in-from-top-5">
                                    <h3 className="text-sm font-bold text-slate-400 mb-3 uppercase tracking-wider">Theme Selection</h3>
                                    <div className="grid grid-cols-2 gap-2">
                                        {Object.keys(THEMES).map((tKey) => (
                                            <button
                                                key={tKey}
                                                onClick={() => changeTheme(tKey)}
                                                className={`h-10 rounded-md border flex items-center justify-center text-xs font-bold ${theme === tKey ? 'border-white ring-1 ring-white' : 'border-transparent opacity-70 hover:opacity-100'
                                                    }`}
                                                style={{ backgroundColor: tKey === 'matrix' ? '#000' : tKey === 'oled' ? '#111' : '#1e293b', color: tKey === 'clean' ? '#000' : '#fff' }}
                                            >
                                                {THEMES[tKey].name}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="mt-4 pt-4 border-t border-slate-700">
                                        <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 text-red-400 hover:text-red-300 text-sm">
                                            <LogOut size={14} /> Log Out
                                        </button>
                                    </div>
                                </div>
                            )}

                            {!user ? (
                                <AuthScreen
                                    mode={authMode} setMode={setAuthMode}
                                    onLogin={handleLogin} onRegister={handleRegister}
                                    email={email} setEmail={setEmail}
                                    pass={password} setPass={setPassword}
                                    error={authError} theme={currentTheme}
                                />
                            ) : (
                                <div className="h-full w-full animate-in fade-in duration-500">
                                    {activeTab === 0 && <InfoShortcutsTab data={user.data.shortcuts} onUpdate={(d) => updateUserData('shortcuts', d)} theme={currentTheme} />}
                                    {activeTab === 1 && <WebsiteShortcutsTab data={user.data.websites} onUpdate={(d) => updateUserData('websites', d)} theme={currentTheme} />}
                                    {activeTab === 2 && <RemindersTab data={user.data.reminders} onUpdate={(d) => updateUserData('reminders', d)} theme={currentTheme} />}
                                    {activeTab === 3 && <ClockTab theme={currentTheme} />}
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        // --- COMPONENTS ---

        // Authentication Screen Component
        function AuthScreen({ mode, setMode, onLogin, onRegister, email, setEmail, pass, setPass, error, theme }) {
            return (
                <div className="h-full w-full flex flex-col items-center justify-center">
                    <div className={`w-full max-w-md p-8 rounded-2xl border ${theme.border} bg-black/20 backdrop-blur-sm`}>
                        <div className="flex justify-center mb-6">
                            <div className={`p-4 rounded-full bg-white/5 ${theme.accent}`}>
                                {mode === 'login' ? <User size={32} /> : <Lock size={32} />}
                            </div>
                        </div>
                        <h2 className="text-2xl font-bold text-center mb-6">
                            {mode === 'login' ? 'Welcome Back' : 'Create Account'}
                        </h2>
                        <form onSubmit={mode === 'login' ? onLogin : onRegister} className="space-y-4">
                            <div>
                                <label className="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
                                <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-3 focus:outline-none focus:border-white/30 transition-colors" placeholder="example@mail.com" required />
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-slate-400 mb-1">Password</label>
                                <input type="password" value={pass} onChange={e => setPass(e.target.value)} className="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-3 focus:outline-none focus:border-white/30 transition-colors" placeholder="••••••••" required />
                                {mode === 'register' && <p className="text-[10px] text-slate-500 mt-1">Min 16 character, Upper/Lower case, Number, Special Character.</p>}
                            </div>
                            {error && <div className="p-3 rounded bg-red-500/10 border border-red-500/20 text-red-400 text-sm text-center">{error}</div>}
                            <button type="submit" className={`w-full py-3 rounded-lg font-bold shadow-lg transition-all active:scale-95 ${theme.button} text-white`}>
                                {mode === 'login' ? 'Login' : 'Register'}
                            </button>
                        </form>
                        <div className="mt-6 text-center text-sm text-slate-400">
                            {mode === 'login' ? 'Don\'t have an account? ' : 'Already have an account? '}
                            <button onClick={() => { setMode(mode === 'login' ? 'register' : 'login'); setAuthError(''); }} className={`font-bold hover:underline ${theme.accent}`}>
                                {mode === 'login' ? 'Register' : 'Login'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Info & Shortcuts Tab Component
        function InfoShortcutsTab({ data, onUpdate, theme }) {
            const [text, setText] = useState('');
            const [type, setType] = useState(SHORTCUT_TYPES[0]);
            const [page, setPage] = useState(0);
            const itemsPerPage = 12;

            const dragItem = useRef();
            const dragOverItem = useRef();

            const handleAdd = () => {
                if (!text) return;
                const newItem = { id: Date.now(), text, type };
                onUpdate([...data, newItem]);
                setText('');
            };

            const handleDelete = (id) => {
                onUpdate(data.filter(i => i.id !== id));
            };

            // Drag-and-drop logic
            const handleDragStart = (e, position) => { dragItem.current = position; };
            const handleDragEnter = (e, position) => { dragOverItem.current = position; };
            const handleDragEnd = () => {
                const copyListItems = [...data];
                const dragItemContent = copyListItems[dragItem.current];
                copyListItems.splice(dragItem.current, 1);
                copyListItems.splice(dragOverItem.current, 0, dragItemContent);
                dragItem.current = null;
                dragOverItem.current = null;
                onUpdate(copyListItems);
            };

            const handleCopy = (txt) => { navigator.clipboard.writeText(txt); };
            const totalPages = Math.ceil(data.length / itemsPerPage) || 1;
            const currentItems = data.slice(page * itemsPerPage, (page + 1) * itemsPerPage);
            const getGlobalIndex = (localIndex) => page * itemsPerPage + localIndex;

            return (
                <div className="h-full flex flex-col gap-6 relative">
                    {/* Add Shortcut Section */}
                    <div className="flex flex-col md:flex-row gap-4 items-end bg-white/5 p-4 rounded-xl border border-white/5">
                        <div className="flex-1 w-full relative">
                            <div className="flex justify-between items-center mb-1">
                                <label className="text-xs text-slate-400 ml-1">Text Content</label>
                            </div>
                            <input value={text} onChange={e => setText(e.target.value)} className="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2 focus:outline-none" placeholder="Shortcut text..." />
                        </div>
                        <div className="w-full md:w-48">
                            <label className="text-xs text-slate-400 ml-1 mb-1 block">Type</label>
                            <select value={type} onChange={e => setType(e.target.value)} className="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2 focus:outline-none cursor-pointer">
                                {SHORTCUT_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                        </div>
                        <button onClick={handleAdd} className={`${theme.button} text-white px-6 py-2 rounded-lg font-bold shadow-lg h-10 w-full md:w-auto`}>ADD</button>
                    </div>

                    {/* Shortcuts List */}
                    <div className="flex-1 overflow-y-auto">
                        <div className="flex flex-wrap content-start gap-4">
                            {currentItems.map((item, index) => (
                                <div
                                    key={item.id}
                                    draggable
                                    onDragStart={(e) => handleDragStart(e, getGlobalIndex(index))}
                                    onDragEnter={(e) => handleDragEnter(e, getGlobalIndex(index))}
                                    onDragEnd={handleDragEnd}
                                    className={`group relative w-full sm:w-[calc(50%-0.5rem)] lg:w-[calc(33.333%-0.7rem)] bg-white/5 border border-white/5 p-3 rounded-lg flex items-center gap-3 cursor-move hover:bg-white/10 transition-colors ${theme.accent}`}
                                >
                                    <div className="text-slate-500"><GripVertical size={16} /></div>
                                    <div className="flex-1 min-w-0">
                                        <div className="text-[10px] text-slate-400 uppercase tracking-wider">{item.type}</div>
                                        <div className="truncate font-mono text-sm text-slate-200" title={item.text}>{item.text}</div>
                                    </div>
                                    <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <button onClick={() => handleCopy(item.text)} className="p-1.5 hover:bg-blue-500/20 text-blue-400 rounded"><Copy size={14} /></button>
                                        <button onClick={() => handleDelete(item.id)} className="p-1.5 hover:bg-red-500/20 text-red-400 rounded"><Trash2 size={14} /></button>
                                    </div>
                                </div>
                            ))}
                            {currentItems.length === 0 && (
                                <div className="w-full h-40 flex items-center justify-center text-slate-500 italic border-2 border-dashed border-white/5 rounded-xl">
                                    No shortcuts added yet.
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Pagination */}
                    <div className="flex justify-center items-center gap-4 py-2">
                        <button disabled={page === 0} onClick={() => setPage(p => p - 1)} className="p-2 rounded-full hover:bg-white/10 disabled:opacity-30"><ChevronLeft /></button>
                        <span className="text-sm font-mono text-slate-400">Page {page + 1} / {totalPages}</span>
                        <button disabled={page >= totalPages - 1} onClick={() => setPage(p => p + 1)} className="p-2 rounded-full hover:bg-white/10 disabled:opacity-30"><ChevronRight /></button>
                    </div>
                </div>
            );
        }

        // Website Shortcuts Tab Component
        function WebsiteShortcutsTab({ data, onUpdate, theme }) {
            const [name, setName] = useState('');
            const [url, setUrl] = useState('');
            const [page, setPage] = useState(0);
            const [isAdding, setIsAdding] = useState(false);
            const itemsPerPage = 18;
            const dragItem = useRef();
            const dragOverItem = useRef();

            const handleAdd = () => {
                if (!name || !url) return;
                let finalUrl = url;
                if (!/^https?:\/\//i.test(url)) finalUrl = 'https://' + url;
                // Google favicon service to fetch website icon
                const iconUrl = `https://www.google.com/s2/favicons?sz=64&domain_url=${finalUrl}`;
                onUpdate([...data, { id: Date.now(), name, url: finalUrl, icon: iconUrl }]);
                setName(''); setUrl(''); setIsAdding(false);
            };

            // Drag-and-drop logic for websites
            const handleDragEnd = () => {
                const copyList = [...data];
                const item = copyList[dragItem.current];
                copyList.splice(dragItem.current, 1);
                copyList.splice(dragOverItem.current, 0, item);
                dragItem.current = null; dragOverItem.current = null;
                onUpdate(copyList);
            };

            const currentItems = data.slice(page * itemsPerPage, (page + 1) * itemsPerPage);
            const totalPages = Math.ceil(data.length / itemsPerPage) || 1;

            return (
                <div className="h-full flex flex-col gap-6">
                    <div className="flex gap-4 h-32">

                        {/* 1. Weather Widget (Left) */}
                        <div className="w-1/4 bg-slate-900/50 border border-blue-500/20 rounded-xl overflow-hidden relative">
                            {/* Weather widget code from external script is inserted here */}
                            <a className="weatherwidget-io pointer-events-none" href="https://forecast7.com/en/41d0128d98/istanbul/" data-label_1="ISTANBUL" data-label_2="Location" data-icons="Climacons Animated" data-mode="Current" data-days="3" data-theme="weather_one" >ISTANBUL Location</a>
                        </div>

                        {/* 2. Currency Rates Widget (Center - Wide Area) */}
                        <div
                            className="flex-1 bg-green-500/10 border border-green-500/20 rounded-xl flex items-center justify-center relative pointer-events-none">
                            <CurrencyRateWidget />
                        </div>

                        {/* 3. Small Clock Widget (Right) */}
                        <div
                            className="w-1/4 bg-blue-500/10 border border-blue-500/20 rounded-xl flex items-center justify-center relative">
                            <ClockWidget />
                        </div>
                    </div>

                    {/* Website Icons Section */}
                    <div className="flex-1 overflow-y-auto p-2">
                        <div className="flex flex-wrap gap-6 justify-start content-start">
                            {/* Add Shortcut Button */}
                            <div onClick={() => setIsAdding(!isAdding)} className="w-20 h-24 flex flex-col items-center
                                justify-center gap-2 cursor-pointer hover:bg-white/5 rounded-xl border border-dashed
                                border-white/20">
                                <div className={`w-12 h-12 rounded-full border-2 border-white/30 flex items-center justify-center
                                    ${isAdding ? 'rotate-45' : ''} transition-transform`}>
                                    <Plus size={24} className="text-slate-400" />
                                </div>
                                <span className="text-[10px] uppercase font-bold text-slate-500">Add</span>
                            </div>

                            {/* Add Shortcut Form */}
                            {isAdding && (
                                <div
                                    className="w-64 p-3 bg-black/50 border border-white/20 rounded-xl flex flex-col gap-2 animate-in zoom-in-95">
                                    <input className="bg-transparent border-b border-white/20 text-xs p-1 focus:outline-none"
                                        placeholder="Website Name" value={name} onChange={e => setName(e.target.value)} />
                                    <input className="bg-transparent border-b border-white/20 text-xs p-1 focus:outline-none"
                                        placeholder="URL" value={url} onChange={e => setUrl(e.target.value)} />
                                    <button onClick={handleAdd}
                                        className="bg-blue-600 text-[10px] py-1 rounded text-white font-bold mt-1">Save</button>
                                </div>
                            )}

                            {/* Website Shortcuts List */}
                            {currentItems.map((item, index) => (
                                <div key={item.id} draggable onDragStart={() => { dragItem.current = (page * itemsPerPage) + index; }}
                                    onDragEnter={() => { dragOverItem.current = (page * itemsPerPage) + index; }}
                                    onDragEnd={handleDragEnd} className="group relative w-20 h-24 flex flex-col items-center gap-2
                                    cursor-pointer">
                                    <a href={item.url} target="_blank" rel="noopener noreferrer"
                                        className="flex flex-col items-center gap-2">
                                        <div
                                            className="w-14 h-14 bg-white/10 rounded-full p-2 hover:scale-110 transition-transform shadow-lg flex items-center justify-center overflow-hidden border border-white/10">
                                            <img src={item.icon} alt={item.name} className="w-8 h-8 object-contain" onError={(e) =>
                                                e.target.src = 'https://via.placeholder.com/32?text=?' /* Fallback image */ } />
                                        </div>
                                        <span
                                            className="text-[10px] font-medium text-slate-300 text-center truncate w-full px-1">{item.name}</span>
                                    </a>
                                    {/* Delete Button */}
                                    <button onClick={(e) => { e.stopPropagation(); onUpdate(data.filter(i => i.id !== item.id)); }}
                                        className="absolute -top-1 -right-1 bg-red-500 text-white rounded-full p-0.5 opacity-0
                                        group-hover:opacity-100 transition-opacity z-10">
                                        <X size={10} />
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Pagination */}
                    {totalPages > 1 && (
                        <div className="flex justify-center items-center gap-4 py-2 border-t border-white/5">
                            <button disabled={page === 0} onClick={() => setPage(p => p - 1)} className="p-2 rounded-full hover:bg-white/10
                                disabled:opacity-30">
                                <ChevronLeft />
                            </button>
                            <span className="text-xs text-slate-500">● ●</span>
                            <button disabled={page >= totalPages - 1} onClick={() => setPage(p => p + 1)} className="p-2 rounded-full
                                hover:bg-white/10 disabled:opacity-30">
                                <ChevronRight />
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // Reminders Tab Component
        function RemindersTab({ data, onUpdate, theme }) {
            const [note, setNote] = useState('');
            const [emoji, setEmoji] = useState('🔴');
            const [date, setDate] = useState('');
            const [showHistory, setShowHistory] = useState(false);

            const activeReminders = data.filter(r => !r.completed);
            const completedReminders = data.filter(r => r.completed);

            // Sort active reminders by date
            const sortedActive = [...activeReminders].sort((a, b) => {
                if (!a.date && !b.date) return 0;
                if (!a.date) return 1;
                if (!b.date) return -1;
                return new Date(a.date) - new Date(b.date);
            });

            const handleAdd = () => {
                if (!note) return;
                const newItem = { id: Date.now(), text: note, emoji, date, completed: false };
                onUpdate([...data, newItem]);
                setNote(''); setDate('');
            };

            const toggleComplete = (id) => {
                onUpdate(data.map(item => item.id === id ? { ...item, completed: !item.completed } : item));
            };

            const deleteItem = (id) => { onUpdate(data.filter(i => i.id !== id)); };

            return (
                <div className="h-full flex flex-col gap-6 relative">
                    {/* Add Reminder Form */}
                    <div className="flex gap-2 items-center bg-white/5 p-3 rounded-xl border border-white/5">
                        <input value={note} onChange={e => setNote(e.target.value)} className="flex-1 bg-transparent border-none
                            focus:outline-none text-sm px-2" placeholder="New reminder..." />
                        {/* Emoji Picker */}
                        <div className="relative group">
                            <button className="p-2 hover:bg-white/10 rounded-lg text-xl">{emoji}</button>
                            <div
                                className="absolute top-full left-0 bg-slate-800 p-2 rounded shadow-xl hidden group-hover:flex gap-1 z-20">
                                {['🔴', '🟡', '🟢', '🔵', '⚫', '⚪'].map(e => <button key={e} onClick={() => setEmoji(e)}
                                    className="hover:bg-white/20 p-1 rounded">{e}</button>)}
                            </div>
                        </div>
                        {/* Date Picker */}
                        <input type="date" value={date} onChange={e => setDate(e.target.value)} className="bg-black/30 border
                            border-white/10 rounded-lg px-2 py-1 text-xs text-slate-300 focus:outline-none" />
                        <button onClick={handleAdd} className={`${theme.button} text-white p-2 rounded-lg`}>
                            <Plus size={20} />
                        </button>
                    </div>

                    {/* Active Reminders List */}
                    <div className="flex-1 overflow-y-auto">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 auto-rows-min">
                            {sortedActive.map(item => (
                                <div key={item.id} className={`group bg-white/5 hover:bg-white/10 border-l-4 ${item.date
                                    ? 'border-red-400' : 'border-blue-400'} rounded-r-lg p-3 flex items-center gap-3 transition-all`}>
                                    <button onClick={() => toggleComplete(item.id)} className="text-slate-500 hover:text-green-400">
                                        <Circle size={20} />
                                    </button>
                                    <div className="flex-1">
                                        <div className="text-sm font-medium text-slate-200">{item.text}</div>
                                        {item.date && <div className="text-[10px] text-red-300 flex items-center gap-1 mt-1">
                                            <Clock size={10} /> {item.date}
                                        </div>}
                                    </div>
                                    <div className="text-2xl">{item.emoji}</div>
                                    <button onClick={() => deleteItem(item.id)} className="opacity-0 group-hover:opacity-100
                                        text-slate-600 hover:text-red-400">
                                        <Trash2 size={16} />
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Completed Reminders Section */}
                    <div className="border-t border-white/10 pt-2">
                        <button onClick={() => setShowHistory(!showHistory)} className="w-full text-center text-xs text-slate-500
                            hover:text-slate-300 py-2">
                            {showHistory ? 'Hide Completed' : `Completed (${completedReminders.length})`}
                        </button>
                        {showHistory && (
                            <div className="mt-2 grid grid-cols-1 md:grid-cols-2 gap-2 opacity-50">
                                {completedReminders.map(item => (
                                    <div key={item.id} className="bg-black/20 p-2 rounded flex items-center gap-2">
                                        <CheckCircle2 size={16} className="text-green-500" />
                                        <span className="text-xs line-through text-slate-500 flex-1">{item.text}</span>
                                        <button onClick={() => deleteItem(item.id)}>
                                            <Trash2 size={12} />
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- CLOCKTAB COMPONENT (WITH MAX MINUTE CONTROL) ---
        function ClockTab({ theme }) {
            const [mode, setMode] = useState('pomodoro');
            const [pomoTime, setPomoTime] = useState(25 * 60);
            const [pomoActive, setPomoActive] = useState(false);
            const [swTime, setSwTime] = useState(0);
            const [swActive, setSwActive] = useState(false);
            const [laps, setLaps] = useState([]);

            const MAX_MINUTES = 1440; // Constant: 24 hours

            // Pomodoro Timer Effect
            useEffect(() => {
                let interval = null;
                if (pomoActive && pomoTime > 0) { interval = setInterval(() => setPomoTime(t => t - 1), 1000); }
                else if (pomoTime === 0) { setPomoActive(false); }
                return () => clearInterval(interval);
            }, [pomoActive, pomoTime]);

            // Stopwatch Effect
            useEffect(() => {
                let interval = null;
                if (swActive) { interval = setInterval(() => setSwTime(t => t + 10), 10); }
                return () => clearInterval(interval);
            }, [swActive]);

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60); const s = seconds % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };
            const formatMs = (ms) => {
                const m = Math.floor(ms / 60000); const s = Math.floor((ms % 60000) / 1000); const cs = Math.floor((ms % 1000) / 10);
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}:${cs.toString().padStart(2, '0')}`;
            };

            // Input Validation and Value Management
            const handleTimerInputChange = (e) => {
                const inputVal = e.target.value.trim();

                if (inputVal === '') {
                    setPomoTime(0);
                    return;
                }

                const minutes = parseInt(inputVal);

                if (minutes < 0) {
                    setPomoTime(0); // Negative number check
                } else if (minutes > MAX_MINUTES) { // NEW CHECK: Max 1440 minutes (24 hours)
                    setPomoTime(MAX_MINUTES * 60);
                } else {
                    setPomoTime(minutes * 60);
                }
            };

            const displayMinutes = pomoTime > 0 ? Math.floor(pomoTime / 60) : '';

            return (
                <div className="h-full flex flex-col items-center justify-center gap-8 relative">
                    {/* Big Clock */}
                    <div className="scale-150 transform"><ClockWidget big={true} /></div>

                    <div className="w-full max-w-2xl grid grid-cols-2 gap-8 mt-8">

                        {/* TIMER */}
                        <div className={`p-6 rounded-2xl border ${theme.border} bg-white/5 flex flex-col items-center gap-4`}>
                            <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest">Timer</h3>
                            <div className="text-5xl font-mono font-bold tracking-tighter">{formatTime(pomoTime)}</div>
                            <div className="flex gap-2 w-full">

                                <input
                                    type="number"
                                    placeholder="Minutes"
                                    className="w-1/4 bg-black/30 rounded px-4 py-2 text-center text-sm focus:outline-none"
                                    onChange={handleTimerInputChange}
                                    value={displayMinutes}
                                    min="0"
                                    max="1440" // HTML max value added (for visual convenience)
                                />

                                <button
                                    onClick={() => setPomoActive(!pomoActive)}
                                    className={`flex-1 rounded font-bold py-2 transition-all active:scale-95 ${pomoActive ? 'bg-red-500 hover:bg-red-600' : 'bg-green-500 hover:bg-green-600'} text-white`}
                                >
                                    {pomoActive ? 'STOP' : 'START'}
                                </button>

                                <button
                                    onClick={() => { setPomoActive(false); setPomoTime(25 * 60) }}
                                    className="bg-slate-700 px-4 py-2 rounded text-white hover:bg-slate-600 transition-all active:scale-95"
                                >
                                    <Settings size={16} />
                                </button>
                            </div>
                        </div>

                        {/* STOPWATCH */}
                        <div className={`p-6 rounded-2xl border ${theme.border} bg-white/5 flex flex-col items-center gap-4`}>
                            <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest">Stopwatch</h3>
                            <div className="text-5xl font-mono font-bold tracking-tighter">{formatMs(swTime)}</div>
                            <div className="flex gap-2 w-full">
                                <button onClick={() => setSwActive(!swActive)} className={`flex-1 rounded font-bold py-2 ${swActive ? 'bg-yellow-500 text-black' : 'bg-blue-500 text-white'} transition-all active:scale-95`}>
                                    {swActive ? 'STOP' : 'START'}
                                </button>
                                <button onClick={() => { setSwTime(0); setLaps([]) }} className="bg-slate-700 px-4 py-2 rounded text-white hover:bg-slate-600 transition-all active:scale-95">RESET</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- CLOCKWIDGET COMPONENT (UPDATED SECONDS SIZE) ---
        function ClockWidget({ big = false }) {
            const [time, setTime] = useState(new Date());
            useEffect(() => { const timer = setInterval(() => setTime(new Date()), 1000); return () => clearInterval(timer); }, []);
            return (
                <div className={`font-mono font-bold text-white text-center flex items-center justify-center gap-2 ${big ? 'text-6xl md:text-8xl tracking-tight' : 'text-4xl'}`}>
                    <span>{time.getHours().toString().padStart(2, '0')}</span><span className="animate-pulse">:</span><span>{time.getMinutes().toString().padStart(2, '0')}</span>

                    {/* Seconds part is now the same size as hours and minutes (text-6xl md:text-8xl) when 'big' */}
                    {big && (
                        <>
                            <span className="animate-pulse text-slate-500">:</span>
                            <span className="text-slate-500 text-6xl md:text-8xl">
                                {time.getSeconds().toString().padStart(2, '0')}
                            </span>
                        </>
                    )}
                </div>
            );
        }

        // --- NEW COMPONENT: CURRENCY RATE WIDGET ---
        function CurrencyRateWidget() {
            const widgetContainer = useRef(null);

            useEffect(() => {
                if (widgetContainer.current) {

                    // 1. Cleanup and preparation
                    widgetContainer.current.innerHTML = '';
                    const scriptId = 'currency-rate-widget-script';
                    const existingScript = document.getElementById(scriptId);
                    if (existingScript) existingScript.remove();

                    // 2. Create USD/TRY Widget
                    const usdWidget = document.createElement('fxwidget-er');
                    usdWidget.setAttribute('amount', '1');
                    usdWidget.setAttribute('decimals', '2');
                    usdWidget.setAttribute('large', 'true'); // Make it BIG because it's in the CENTER
                    usdWidget.setAttribute('symbol', 'true');
                    usdWidget.setAttribute('flag', 'true'); // Re-enable flags
                    usdWidget.setAttribute('main-curr', 'USD');
                    usdWidget.setAttribute('sel-curr', 'TRY');
                    usdWidget.setAttribute('background-color', 'transparent');
                    usdWidget.style.display = 'block';

                    // 3. Create EUR/TRY Widget (Since the widget format is single-use, we create another one for EUR)
                    const eurWidget = usdWidget.cloneNode(true);
                    eurWidget.setAttribute('main-curr', 'EUR');

                    // 4. Append to Container (Flex for side-by-side display)
                    const flexWrapper = document.createElement('div');
                    flexWrapper.style.display = 'flex';
                    flexWrapper.style.gap = '16px'; // Add some gap

                    flexWrapper.appendChild(usdWidget);
                    flexWrapper.appendChild(eurWidget);
                    widgetContainer.current.appendChild(flexWrapper);

                    // 5. Dynamically load the widget script
                    const widgetScript = document.createElement('script');
                    widgetScript.id = scriptId;
                    widgetScript.src = 'https://currencyrate.today/widget/latest-currency-converter-rate-widgets.js';
                    widgetScript.async = true;
                    document.body.appendChild(widgetScript);

                    return () => {
                        const scriptToRemove = document.getElementById(scriptId);
                        if (scriptToRemove) scriptToRemove.remove();
                    };
                }
            }, []);

            return (
                <div
                    ref={widgetContainer}
                    className="w-full h-full flex items-center justify-center p-2"
                >
                    {/* Widgets will load here */}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <App />);

        // Weather Widget Script Loader
        !function (d, s, id) { var js, fjs = d.getElementsByTagName(s)[0]; if (!d.getElementById(id)) { js = d.createElement(s); js.id = id; js.src = 'https://weatherwidget.io/js/widget.min.js'; fjs.parentNode.insertBefore(js, fjs); } }(document, 'script', 'weatherwidget-io-js');
    </script>

</body>

</html>
